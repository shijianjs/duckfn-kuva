distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 用官方源：CI 与其它贡献者都拉得到，不必跨区。
# 9.6.0 是 AGP 9.4 的最低要求（低版本 AGP 会在 version-check 里直接报出来）。
#
# 本地想走国内镜像就把这一行换成
#   https\://mirrors.cloud.tencent.com/gradle/gradle-9.6.0-bin.zip
# 注意 wrapper 的缓存目录名是 distributionUrl 的哈希（base36(MD5(url))），换 URL 等于换目录、
# 会重下一次；已经下好的那份可以从旧目录原样拷过去（gradle-9.6.0/ 与 .ok 标记），无需重下。
#
# Official source: reachable from CI and for every contributor. To use a mirror locally, swap the line
# below; note the wrapper caches per distributionUrl (base36(MD5(url))), so a different URL is a
# different directory — copy the extracted `gradle-9.6.0/` plus the `.ok` marker over instead of
# re-downloading.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.0-bin.zip
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
