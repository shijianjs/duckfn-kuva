extension:
  name: duckfn_kuva
  description: Statistical plotting in SQL - a JSON chart spec in, an SVG document out, with no Python or R needed
  version: 0.1.0
  language: Rust
  build: cargo
  license: MIT
  requires_toolchains: "rust;python3"
  maintainers:
    - shijianjs

repo:
  github: shijianjs/duckfn-kuva
  ref: <40-character commit SHA of the released version>

docs:
  hello_world: |
    -- One function: a JSON chart spec in, an SVG document out
    SELECT kuva_render('{"series":[{"type":"scatter","data":[[1,2],[3,4],[5,3]]}]}');
    -- <svg xmlns="http://www.w3.org/2000/svg" ...> ... </svg>

    -- Several series overlay on one set of axes
    SELECT kuva_render('{"series":[{"type":"line","data":[[0,1],[1,2],[2,1.5]],"legend":"signal"},{"type":"scatter","data":[[0,1.2],[1,1.8],[2,1.6]],"legend":"observed"}]}');
    -- <svg xmlns="http://www.w3.org/2000/svg" ...> ... </svg>

    -- Or a multi-panel figure grid
    SELECT kuva_render('{"figure":{"rows":1,"cols":2,"panels":[{"series":[{"type":"scatter","data":[[1,2],[2,3]]}]},{"series":[{"type":"histogram","values":[1,2,2,3,3,3,4],"bins":4}]}]}}');
    -- <svg xmlns="http://www.w3.org/2000/svg" ...> ... </svg>
  extended_description: |
    Renders statistical charts from SQL. The extension wraps the Rust plotting library kuva (SVG backend
    only) and exposes it as a single scalar function, so charts work anywhere DuckDB runs - the CLI, a
    Python or R session, the JVM, or the browser build (DuckDB-Wasm) - from one and the same extension
    binary. There is no matplotlib or ggplot2 in the loop, and no plotting environment to install.

    | Function | Kind | Input -> output |
    | --- | --- | --- |
    | `kuva_render(spec)` | scalar | `VARCHAR` (a JSON chart spec) -> `VARCHAR` (an SVG document) |

    The JSON spec uses snake_case keys and describes the drawing rather than one particular chart. The
    top-level keys are `title`, `x_axis`, `y_axis`, `grid`, `legend`, `theme`, `palette`, `font`,
    `annotations`, `width`, `height` and `series`. Every `series` entry carries a `type` - currently
    `scatter`, `line`, `bar`, `histogram`, `box` or `pie` - and declares only the fields that type
    needs, so a scatter takes `data` as `[x, y]` pairs or objects with optional `x_err` / `y_err`,
    a bar takes `categories` plus `values` (or several named `series` for grouped and stacked bars),
    a histogram takes `values` with optional `bins` and a `kde` overlay, a box takes `groups` of raw
    values, and a pie takes `slices`.

    JSON rather than a STRUCT is deliberate: the series of one figure are heterogeneous, and a STRUCT
    list cannot hold a mix of them.

    Composition works two ways. Several series in one `series` array are overlaid on a shared set of
    axes - a line with its scatter points on top, for instance. A top-level `figure` with `rows`,
    `cols` and `panels` switches to a multi-panel grid with shared axes and an optional shared legend.

    `theme` selects light, dark, minimal or solarized (or overrides individual colours), `palette`
    selects one of the named palettes or an explicit colour list, and `annotations` adds reference
    lines, shaded regions and text callouts. `grid` and `legend` cover the axis chrome, tick formats,
    grayscale (accessibility) mode and legend placement; `width`, `height` and `scale` size the canvas.

    A malformed spec fails the query with an actionable message rather than returning NULL, so a typo
    is never silent - for example a bar whose `values` and `categories` differ in length is rejected
    before anything is drawn.

    Requires **DuckDB 1.3 or newer**: the extension is built against DuckDB 1.5.6 headers but declares
    the C API floor it needs (v1.2.0), so one binary loads into 1.3.2 through 1.5.6 alike. The full
    field reference and the development notes live in the repository:
    <https://github.com/shijianjs/duckfn-kuva>.