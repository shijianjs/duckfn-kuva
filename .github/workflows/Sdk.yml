#
# `sdk/` 下各语言 SDK 的 CI：重生成产物（JSON Schema / TypeScript），构建并测试 TS / Java / Kotlin。
#
# 触发面与文档站（DeployDocs.yml）一致：**扩展分发流水线跑完之后**，或从 Actions 页手动发起 ——
# 日常提交与 PR 都不跑。门禁条件也一样：只有「成功 + 由推 v*.*.* tag 触发」的那次流水线才继续，
# 也就是**只有插件发版才触发**。
#
# 为什么独立成一份而不挂在 MainDistributionPipeline 里：那是 DuckDB 扩展的构建 / 发布流水线，
# SDK 只是它的下游消费者 —— 两者的版本节奏、依赖和失败语义都不同，不该互相拖累。
#
# The CI for the language SDKs under `sdk/`: regenerate the artifacts (JSON Schema / TypeScript) and
# build + test the TS / Java / Kotlin SDKs. Triggered the way the docs site (DeployDocs.yml) is —
# after the extension distribution pipeline finishes, or manually from the Actions tab; ordinary
# pushes and pull requests do not run it. The gate is the same as the docs site's: only a successful
# run started by pushing a `v*.*.*` tag continues, i.e. **only a plugin release triggers it**.
#
# It lives in its own workflow rather than in MainDistributionPipeline because that file is the
# DuckDB extension's build/release pipeline and the SDKs are merely downstream consumers of it.
#
name: SDK
on:
  workflow_run:
    workflows: ['Main Extension Distribution Pipeline']
    types: [completed]
  workflow_dispatch:

# 只需要读代码。
permissions:
  contents: read

# 同一个提交只留最后一次运行。
concurrency:
  group: sdk-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  sdk:
    name: Regenerate and test the SDKs
    # workflow_run 也会为 PR 触发的流水线、以及手动触发的流水线跑；只有「成功 + 推 tag」才继续。
    #
    # A `workflow_run` also fires for pipeline runs started by pull requests and by hand; only a
    # successful version-tag run goes on.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run 默认 checkout 默认分支；这里要的是流水线跑的那个 tag。
          #
          # A `workflow_run` checks out the default branch by default; we want the tag it built.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # ---- 1) JSON Schema（Rust 里那两个真相源的投影）----
      # ubuntu-latest 自带 Rust；schema 生成器只依赖 schemars（可选 feature，见 Cargo.toml）。
      #
      # ubuntu-latest ships Rust; the schema generator only needs schemars (the optional feature).
      - name: Regenerate the JSON Schema
        run: cargo run --bin json_schema --features json-schema

      # ---- 2) TypeScript SDK ----
      # 生成器由 sdk/ts/package-lock.json 钉版本，`npm ci` 严格按锁文件装。
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/ts/package-lock.json

      - name: Build and test the TypeScript SDK
        run: |
          set -euo pipefail
          cd sdk/ts
          npm ci
          npm run gen
          npm test

      # ---- 3) Java SDK ----
      # ubuntu runner 自带 JDK 与 Maven（Java SDK 只要 JDK 17+）。生成物落在 sdk/java/target，
      # 已被 gitignore，不进下面的 diff；这一步是确认生成链路通。
      #
      # The ubuntu runner ships JDK + Maven (the Java SDK only needs JDK 17+). Its output lands in
      # sdk/java/target (gitignored) and never reaches the diff check below; this step proves the
      # generation chain works.
      - name: Build and test the Java SDK
        run: |
          set -euo pipefail
          cd sdk/java
          mvn -B -q test

      # ---- 4) Kotlin Multiplatform SDK ----
      # ogen 要求 JDK 21+（runner 默认未必是），所以显式装一个。Gradle 由 sdk/kotlin 里
      # 提交的 wrapper 自带（发行包走国内镜像，见 gradle-wrapper.properties）。
      #
      # ogen needs JDK 21+ (the runner default may be older), so install one explicitly. Gradle comes
      # from the committed wrapper under sdk/kotlin.
      - name: Set up JDK 21 for the Kotlin SDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Build and test the Kotlin SDK
        run: |
          set -euo pipefail
          cd sdk/kotlin
          ./gradlew ogenGenerate jvmTest

      # ---- 5) 产物必须与源码同步 ----
      # 只盯 sdk/：源码那边有 diff 是正常的，产物这边不允许「忘了重新生成」。
      #
      # Only sdk/ is watched: diffs in the sources are normal, a stale artifact is not.
      - name: Check the artifacts are unchanged
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- sdk/; then
            echo "::error::sdk/ is stale — run 'just json_schema' and 'just ts_sdk', then commit the result"
            exit 1
          fi
